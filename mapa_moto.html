<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Mapa Moto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; height: 100vh; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

<script>
  var map, userMarker, directionsService, directionsRenderer;
  var userLat, userLng;

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      zoom: 16,
      center: { lat: 4.4378, lng: -75.2012 },
      mapTypeId: 'roadmap',
      fullscreenControl: false,
      streetViewControl: false,
      mapTypeControl: false,
      zoomControl: true,
      gestureHandling: 'greedy'
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({
      map: map,
      suppressMarkers: false,
      polylineOptions: {
        strokeColor: '#1A73E8',
        strokeWeight: 6
      }
    });

    // Barra de búsqueda nativa de Google Maps
    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '¿A dónde vas?';
    input.style.cssText = `
      width: 80%;
      padding: 12px 16px;
      margin: 10px auto;
      display: block;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      outline: none;
      background: white;
      color: #333;
    `;
    map.controls[google.maps.ControlPosition.TOP_CENTER].push(input);

    var autocomplete = new google.maps.places.Autocomplete(input, {
      componentRestrictions: { country: 'co' },
      fields: ['geometry', 'name']
    });

    autocomplete.addListener('place_changed', function() {
      var place = autocomplete.getPlace();
      if (!place.geometry) return;
      calcularRuta(place.geometry.location);
    });

    iniciarGPS();
  }

  function iniciarGPS() {
    if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(function(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;

      map.setCenter({ lat: userLat, lng: userLng });

      userMarker = new google.maps.Marker({
        position: { lat: userLat, lng: userLng },
        map: map,
        title: 'Tu ubicación',
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 10,
          fillColor: '#4285F4',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 3
        },
        zIndex: 999
      });

      // Actualizar posición en tiempo real
      navigator.geolocation.watchPosition(function(p) {
        userLat = p.coords.latitude;
        userLng = p.coords.longitude;
        if (userMarker) {
          userMarker.setPosition({ lat: userLat, lng: userLng });
        }
      }, null, { enableHighAccuracy: true, maximumAge: 3000 });

    }, null, { enableHighAccuracy: true });
  }

  function calcularRuta(destino) {
    if (!userLat) return;

    directionsService.route({
      origin: { lat: userLat, lng: userLng },
      destination: destino,
      travelMode: google.maps.TravelMode.DRIVING,
      region: 'CO'
    }, function(result, status) {
      if (status === 'OK') {
        directionsRenderer.setDirections(result);
        var leg = result.routes[0].legs[0];

        // Panel de info de ruta
        var panel = document.getElementById('ruta-panel');
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'ruta-panel';
          panel.style.cssText = `
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            min-width: 200px;
          `;
          map.controls[google.maps.ControlPosition.BOTTOM_CENTER].push(panel);
        }

        var ahora = new Date();
        ahora.setSeconds(ahora.getSeconds() + leg.duration.value);
        var h = ahora.getHours().toString().padStart(2,'0');
        var m = ahora.getMinutes().toString().padStart(2,'0');

        panel.innerHTML = `
          <div style="font-size:22px;font-weight:bold;color:#4CAF50">${leg.duration.text}</div>
          <div style="color:#aaa;font-size:13px">${leg.distance.text} · Llegada ${h}:${m}</div>
        `;
      }
    });
  }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2KJ_X_o7HSfeM9Y6HFMq7QlmDlqpOu40&libraries=places&callback=initMap" async defer></script>

</body>
</html>
