<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RaiderDash - Moto CarPlay</title>
    <style>
        /* --- CORE & LAYOUT RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            position: fixed;
        }

        .dashboard-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            padding: 8px;
            gap: 8px;
        }

        /* --- COLUMNAS PRINCIPALES (60% / 30% / 10%) --- */
        .col-left {
            width: 60%;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #151515;
            border-radius: 14px;
            border: 1px solid #2d2d2d;
            position: relative;
        }

        .col-center {
            width: 30%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* --- PANEL DE NOTIFICACIONES --- */
        #panel-notificaciones {
            height: 60%;
            background-color: #161616;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            border: 1px solid #2d2d2d;
        }

        .noti-item {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #2d2d2d;
        }

        .noti-item.unread {
            border-left: 5px solid #1DB954 !important;
        }

        .noti-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .noti-app-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .noti-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .noti-body {
            font-size: 1rem;
            color: #e5e5ea;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- PANEL DE MÚSICA SPOTIFY --- */
        #panel-musica {
            height: 40%;
            background-color: #1c1c1e;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #2d2d2d;
        }

        .btn-spotify-login {
            background-color: #1db954;
            color: black;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            min-height: 60px;
            width: 100%;
        }

        .player-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .track-meta-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .album-art {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            background-color: #2c2c2e;
            object-fit: cover;
        }

        .music-title { font-weight: bold; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-artist { color: #aeaeb2; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-container { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #aeaeb2; }
        .progress-bar-wrapper { flex: 1; display: flex; align-items: center; height: 14px; }
        .progress-bg { width: 100%; height: 5px; background-color: #3a3a3c; border-radius: 3px; }
        .progress-current { height: 100%; background-color: #1db954; border-radius: 3px; width: 0%; }
        .volume-container { display: flex; align-items: center; gap: 8px; }
        .volume-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #3a3a3c; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; }

        .music-controls { display: flex; justify-content: space-between; gap: 6px; }
        .btn-music {
            flex: 1;
            background-color: #2c2c2e;
            border: none;
            color: white;
            font-size: 1.6rem;
            border-radius: 10px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #play-btn { background-color: #1db954; color: black; font-size: 1.8rem; }

        /* --- COLUMNA DERECHA: SIDEBAR --- */
        .col-right { width: 10%; height: 100%; }
        #sidebar {
            width: 100%; height: 100%; background-color: #161616; border-radius: 14px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 8px; gap: 8px; border: 1px solid #2d2d2d;
        }

        .btn-nav {
            flex: 1; min-height: 65px; background-color: #2c2c2e; border: none; border-radius: 10px;
            color: white; font-size: 1.4rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-nav.active { background-color: #0a84ff; }

        /* --- MAP ELEMENTS --- */
        .search-container { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; }
        #search-input {
            width: 100%; height: 65px; background-color: rgba(25, 25, 25, 0.95); border: 2px solid #444;
            border-radius: 12px; padding: 0 15px; color: white; font-size: 1.15rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .pac-container { background-color: #1e1e1e !important; border: 1px solid #444 !important; border-radius: 10px; z-index: 10000 !important; }
        .pac-item { border-top: 1px solid #333 !important; padding: 14px 16px !important; font-size: 1.05rem !important; color: #fff !important; }
        .pac-item-query { color: #fff !important; font-size: 1.05rem !important; }
        
        .top-bar-info {
            position: absolute; top: 85px; left: 10px; z-index: 5; background: rgba(0, 0, 0, 0.8);
            padding: 8px 14px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; border: 1px solid #333;
        }

        #route-panel {
            position: absolute; bottom: 10px; left: 10px; right: 10px; height: 75px;
            background: rgba(20, 20, 20, 0.95); border: 1px solid #3a3a3c; border-radius: 12px;
            z-index: 10; display: none; align-items: center; justify-content: space-around;
        }

        .route-metric { text-align: center; }
        .route-metric .value { font-size: 1.5rem; font-weight: bold; color: #30d158; }
        .route-metric .label { font-size: 0.75rem; color: #aeaeb2; text-transform: uppercase; }
        .route-metric.dest .value { color: #ff9f0a; }

        .pulse-marker {
            width: 20px; height: 20px; background: #0a84ff; border: 3px solid white;
            border-radius: 50%; position: absolute; transform: translate(-50%, -50%); animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(10, 132, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(10, 132, 255, 0); }
        }
    </style>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="render-engine" content="webkit">
</head>
<body>

    <div class="dashboard-container">
        <div class="col-left">
            <div class="search-container"><input id="search-input" type="text" placeholder="¿A dónde vamos, parceros?"></div>
            <div class="top-bar-info" id="live-clock">00:00</div>
            <div id="map"></div>
            <div id="route-panel">
                <div class="route-metric"><div class="value" id="route-duration">-- min</div><div class="label">Tiempo</div></div>
                <div class="route-metric"><div class="value" id="route-distance">-- km</div><div class="label">Distancia</div></div>
                <div class="route-metric dest"><div class="value" id="route-eta">--:--</div><div class="label">Llegada</div></div>
            </div>
        </div>

        <div class="col-center">
            <div id="panel-notificaciones"></div>
            <div id="panel-musica"></div>
        </div>

        <div class="col-right">
            <nav id="sidebar">
                <button class="btn-nav active">🗺️</button>
                <button class="btn-nav">🎵</button>
                <button class="btn-nav">💬</button>
                <button class="btn-nav">⚙️</button>
            </nav>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA2KJ_X_o7HSfeM9Y6HFMq7QlmDlqpOu40&libraries=places&callback=initMap&loading=async" async defer></script>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (e.target.id !== 'panel-notificaciones' && !document.getElementById('panel-notificaciones').contains(e.target)) {
                e.preventDefault(); 
            }
        }, { passive: false });

        let notificationsList = JSON.parse(localStorage.getItem('moto_notifications')) || [];
        window.addNotification = function(app, titulo, cuerpo) {
            const ahora = new Date();
            const horaFormateada = ahora.getHours().toString().padStart(2, '0') + ':' + ahora.getMinutes().toString().padStart(2, '0');
            const nuevaNoti = { icono: '🔔', app: app, titulo: titulo, cuerpo: cuerpo, hora: horaFormateada, unread: true };
            notificationsList.unshift(nuevaNoti);
            if (notificationsList.length > 3) notificationsList.pop();
            localStorage.setItem('moto_notifications', JSON.stringify(notificationsList));
            renderNotifications();
        };

        function renderNotifications() {
            const contenedor = document.getElementById('panel-notificaciones');
            contenedor.innerHTML = '';
            if (notificationsList.length === 0) {
                contenedor.innerHTML = `<div style="text-align: center; color: #8e8e93; margin-top: 50px;">Sin notificaciones</div>`;
                return;
            }
            notificationsList.forEach(noti => {
                contenedor.insertAdjacentHTML('beforeend', `
                    <div class="noti-item ${noti.unread ? 'unread' : ''}">
                        <div class="noti-header">
                            <div class="noti-app-info"><span class="noti-title">${noti.titulo}</span></div>
                            <span class="noti-time">${noti.hora}</span>
                        </div>
                        <div class="noti-body">${noti.cuerpo}</div>
                    </div>
                `);
            });
        }

        let map, userMarker, autocomplete, directionsService, directionsRenderer;
        let currentPosition = null;

        function initMap() {
            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                suppressMarkers: true,
                polylineOptions: { strokeColor: "#0a84ff", strokeOpacity: 0.8, strokeWeight: 6 }
            });

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 15,
                center: { lat: 4.6097, lng: -74.0817 },
                styles: [{ "elementType": "geometry", "stylers": [{ "color": "#212121" }] }, { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] }, { "featureType": "landscape", "stylers": [{ "color": "#151515" }] }, { "featureType": "road", "elementType": "geometry.fill", "stylers": [{ "color": "#2c2c2c" }] }, { "featureType": "water", "stylers": [{ "color": "#0d1b2a" }] }],
                disableDefaultUI: true
            });

            directionsRenderer.setMap(map);
            initGeolocation();

            autocomplete = new google.maps.places.Autocomplete(document.getElementById('search-input'), {
                componentRestrictions: { country: 'co' },
                fields: ['geometry', 'name']
            });
            autocomplete.addListener('place_changed', onPlaceChanged);
        }

        function initGeolocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => { updatePosition(pos); map.setCenter(currentPosition); }, null, { enableHighAccuracy: true });
                navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
            }
        }

        function updatePosition(position) {
            currentPosition = { lat: position.coords.latitude, lng: position.coords.longitude };
            if (!userMarker) {
                userMarker = new google.maps.Marker({ position: currentPosition, map: map, optimized: false });
                const pulseDiv = document.createElement('div');
                pulseDiv.className = 'pulse-marker';
                const overlay = new google.maps.OverlayView();
                overlay.draw = function () {
                    const pos = this.getProjection().fromLatLngToDivPixel(userMarker.getPosition());
                    if (pos) { pulseDiv.style.left = pos.x + 'px'; pulseDiv.style.top = pos.y + 'px'; }
                };
                overlay.onAdd = function () { this.getPanes().overlayMouseTarget.appendChild(pulseDiv); };
                overlay.setMap(map);
            } else {
                userMarker.setPosition(currentPosition);
            }
        }

        function onPlaceChanged() {
            const place = autocomplete.getPlace();
            if (!place.geometry || !currentPosition) return;
            directionsService.route({ origin: currentPosition, destination: place.geometry.location, travelMode: 'DRIVING' }, (res, status) => {
                if (status === 'OK') {
                    directionsRenderer.setDirections(res);
                    const route = res.routes[0].legs[0];
                    document.getElementById('route-duration').innerText = route.duration.text;
                    document.getElementById('route-distance').innerText = route.distance.text;
                    const eta = new Date(Date.now() + route.duration.value * 1000);
                    document.getElementById('route-eta').innerText = `${eta.getHours().toString().padStart(2, '0')}:${eta.getMinutes().toString().padStart(2, '0')}`;
                    document.getElementById('route-panel').style.display = 'flex';
                }
            });
        }

        // --- SPOTIFY WEB API (REQUISITO 3: Redirect directo al index.html sin callback intermedio) ---
        const CLIENT_ID = '3f826352b00a49a091904b80a7ca81b8';
        const REDIRECT_URI = 'https://davidprimo-ctrl.github.io/RaiderDash/index.html'; 
        const SCOPES = 'user-modify-playback-state user-read-playback-state user-read-currently-playing';

        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let text = '';
            for (let i = 0; i < length; i++) { text += possible.charAt(Math.floor(Math.random() * possible.length)); }
            return text;
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return crypto.subtle.digest('SHA-256', data);
        }

        function base64urlencode(a) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(a))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function redirectToSpotifyAuth() {
            const codeVerifier = generateRandomString(64);
            const hashed = await sha256(codeVerifier);
            const codeChallenge = base64urlencode(hashed);
            localStorage.setItem('spotify_code_verifier', codeVerifier);

            window.location.href = `https://accounts.spotify.com/authorize?response_type=code&client_id=${CLIENT_ID}&scope=${encodeURIComponent(SCOPES)}&code_challenge_method=S256&code_challenge=${codeChallenge}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
        }

        async function handleAuthorizationCode(code) {
            const codeVerifier = localStorage.getItem('spotify_code_verifier');
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI, code_verifier: codeVerifier })
            });
            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('spotify_access_token', data.access_token);
                localStorage.setItem('spotify_refresh_token', data.refresh_token);
                window.history.replaceState({}, document.title, window.location.pathname);
                initPlayer();
            }
        }

        async function spotifyFetch(endpoint, method = 'GET', body = null) {
            let token = localStorage.getItem('spotify_access_token');
            if (!token) return null;
            const config = { method: method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
            if (body) config.body = JSON.stringify(body);

            let response = await fetch(`https://api.spotify.com/v1/${endpoint}`, config);
            if (response.status === 401) {
                token = await refreshSpotifyToken();
                if (token) return spotifyFetch(endpoint, method, body);
            }
            if (method === 'GET' && response.status === 200) return await response.json();
            return response;
        }

        async function refreshSpotifyToken() {
            const refreshToken = localStorage.getItem('spotify_refresh_token');
            if (!refreshToken) return redirectToSpotifyAuth();
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refreshToken, client_id: CLIENT_ID })
            });
            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('spotify_access_token', data.access_token);
                return data.access_token;
            }
            return null;
        }

        function renderPlayerView() {
            document.getElementById('panel-musica').innerHTML = `
                <div class="player-layout">
                    <div class="track-meta-block">
                        <img id="sp-art" class="album-art" src="" style="display:none">
                        <div class="track-text">
                            <div id="sp-title" class="music-title">Sin multimedia</div>
                            <div id="sp-artist" class="music-artist">Abre Spotify</div>
                        </div>
                    </div>
                    <div class="progress-container">
                        <span id="progress-time">0:00</span>
                        <div class="progress-bar-wrapper"><div class="progress-bg"><div id="progress-curr" class="progress-current"></div></div></div>
                        <span id="total-time">0:00</span>
                    </div>
                    <div class="volume-container">
                        <input type="range" class="volume-slider" min="0" max="100" value="50" onchange="spotifyFetch('me/player/volume?volume_percent='+this.value, 'PUT')">
                    </div>
                    <div class="music-controls">
                        <button class="btn-music" onclick="spotifyFetch('me/player/previous', 'POST')">⏮</button>
                        <button class="btn-music" id="play-btn" onclick="togglePlayback()">▶</button>
                        <button class="btn-music" onclick="spotifyFetch('me/player/next', 'POST')">⏭</button>
                    </div>
                </div>`;
        }

        let isTrackPlaying = false;
        async function updatePlaybackState() {
            const data = await spotifyFetch('me/player/currently-playing');
            if (!data || !data.item) return;
            isTrackPlaying = data.is_playing;
            document.getElementById('sp-title').innerText = data.item.name;
            document.getElementById('sp-artist').innerText = data.item.artists.map(a => a.name).join(', ');
            const art = document.getElementById('sp-art'); art.src = data.item.album.images[0].url; art.style.display = 'block';
            document.getElementById('play-btn').innerText = isTrackPlaying ? "⏸" : "▶";
            document.getElementById('progress-curr').style.width = `${(data.progress_ms / data.item.duration_ms) * 100}%`;
            document.getElementById('progress-time').innerText = formatMs(data.progress_ms);
            document.getElementById('total-time').innerText = formatMs(data.item.duration_ms);
        }

        function formatMs(ms) { const m = Math.floor(ms / 60000); const s = ((ms % 60000) / 1000).toFixed(0); return `${m}:${s.padStart(2, '0')}`; }
        async function togglePlayback() { await spotifyFetch(isTrackPlaying ? 'me/player/pause' : 'me/player/play', 'PUT'); setTimeout(updatePlaybackState, 300); }
        function initPlayer() { renderPlayerView(); updatePlaybackState(); setInterval(updatePlaybackState, 5000); }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }
        setInterval(updateClock, 1000); updateClock();

        // --- MANEJO DE ONLOAD (REQUISITO 2 Y 3: Intercepta el código directo) ---
        window.onload = function() {
            renderNotifications();
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const token = localStorage.getItem('spotify_access_token');

            if (code) {
                handleAuthorizationCode(code);
            } else if (token) {
                initPlayer();
            } else {
                document.getElementById('panel-musica').innerHTML = `<div class="spotify-login-container"><button class="btn-spotify-login" onclick="redirectToSpotifyAuth()">VINCULAR SPOTIFY 🎵</button></div>`;
            }
        }
    </script>
</body>
</html>
