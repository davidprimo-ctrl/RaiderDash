<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spotify Auth</title>
  <style>
    body { background: #0d0d0d; color: white; font-family: Arial; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; flex-direction: column; gap: 16px; }
    .msg { font-size: 18px; color: #1DB954; }
    .sub { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="msg">✓ Spotify conectado</div>
  <div class="sub">Puedes cerrar esta ventana y volver a tu app</div>
<script>
  // Extrae el token del hash de la URL
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  if (token) {
    // Guarda el token para que la app lo pueda leer
    localStorage.setItem('spotify_token', token);
    // Intenta comunicarse con la app via postMessage
    if (window.opener) {
      window.opener.postMessage({ spotify_token: token }, '*');
      setTimeout(() => window.close(), 1500);
    }
  }
</script>
</body>
</html>
