<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Redirecting...</title>
</head>
<body style="background-color: #0d0d0d;">
    <script>
        // Captura el código que envía Spotify
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        // CORRECCIÓN: Apunta exactamente a tu archivo real
        const FINAL_URL = 'https://davidprimo-ctrl.github.io/RaiderDash/gemini-code-1780024285318.html';

        if (code) {
            // Redirige pasando el código para que el window.onload lo procese
            window.location.replace(`${FINAL_URL}?code=${code}`);
        } else {
            window.location.replace(FINAL_URL);
        }
    </script>
</body>
</html>
