<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d0d; color: white; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #login-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
    #login-btn { background: #1DB954; color: white; border: none; padding: 14px 28px; border-radius: 30px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; max-width: 260px; }
    #status-msg { font-size: 12px; color: #666; text-align: center; min-height: 16px; }

    #player-screen { flex: 1; display: none; flex-direction: column; padding: 10px; gap: 8px; }

    .song-info { background: #1a1a1a; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; }
    .album-art { width: 52px; height: 52px; border-radius: 8px; background: #2a2a2a; object-fit: cover; flex-shrink: 0; }
    .song-title { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 12px; color: #aaa; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-status { font-size: 11px; color: #1DB954; margin-top: 3px; }

    .progress-area { padding: 0 2px; }
    .progress-bar { height: 3px; background: #2a2a2a; border-radius: 2px; }
    .progress-fill { height: 3px; background: #1DB954; border-radius: 2px; width: 0%; transition: width 1s linear; }
    .time-row { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-top: 3px; }

    .controls { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 6px; }
    .ctrl-btn { background: #1a1a1a; border: 0.5px solid #2a2a2a; border-radius: 12px; padding: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 26px; -webkit-tap-highlight-color: transparent; }
    .ctrl-btn:active { background: #2a2a2a; transform: scale(0.95); }
    .ctrl-btn.play { background: #1DB954; border-color: #1DB954; font-size: 30px; }

    .vol-area { background: #1a1a1a; border-radius: 12px; padding: 10px 14px; }
    .vol-label { font-size: 10px; color: #555; margin-bottom: 6px; }
    .vol-row { display: flex; align-items: center; gap: 8px; }
    .vol-bar { flex: 1; height: 4px; background: #2a2a2a; border-radius: 2px; cursor: pointer; }
    .vol-fill { height: 4px; background: #666; border-radius: 2px; pointer-events: none; }
    .vol-icon { font-size: 16px; color: #555; cursor: pointer; user-select: none; }

    #logout-btn { background: none; border: 0.5px solid #333; color: #555; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; align-self: center; }
  </style>
</head>
<body>

<div id="login-screen">
  <div style="font-size:36px">🎵</div>
  <div style="font-size:16px;font-weight:bold">Conectar Spotify</div>
  <div style="font-size:12px;color:#666;text-align:center">Toca el botón para autorizar</div>
  <button id="login-btn" onclick="loginSpotify()">Conectar con Spotify</button>
  <div id="status-msg"></div>
</div>

<div id="player-screen">
  <div class="song-info">
    <img id="album-art" class="album-art" src="" style="display:none">
    <div style="flex:1;min-width:0">
      <div id="song-title" class="song-title">Cargando...</div>
      <div id="song-artist" class="song-artist">--</div>
      <div id="song-status" class="song-status">● Conectado</div>
    </div>
  </div>
  <div class="progress-area">
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div class="time-row"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
  </div>
  <div class="controls">
    <div class="ctrl-btn" onclick="prevTrack()">⏮</div>
    <div class="ctrl-btn play" id="play-btn" onclick="togglePlay()">⏵</div>
    <div class="ctrl-btn" onclick="nextTrack()">⏭</div>
  </div>
  <div class="vol-area">
    <div class="vol-label">VOLUMEN</div>
    <div class="vol-row">
      <span class="vol-icon" onclick="changeVol(-10)">🔈</span>
      <div class="vol-bar" onclick="handleVolClick(event)">
        <div id="vol-fill" class="vol-fill" style="width:50%"></div>
      </div>
      <span class="vol-icon" onclick="changeVol(10)">🔊</span>
    </div>
  </div>
  <button id="logout-btn" onclick="logout()">Desconectar</button>
</div>

<script>
  const CLIENT_ID = '3f826352b00a49a091904b80a7ca81b8';
  const REDIRECT_URI = 'https://davidprimo-ctrl.github.io/RaiderDash/callback.html';
  const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';

  let accessToken = null;
  let isPlaying = false;
  let currentVolume = 50;
  let progressInterval = null;
  let currentProgress = 0;
  let currentDuration = 0;

  async function generatePKCE() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    let verifier = '';
    for (let i = 0; i < 64; i++) verifier += chars[Math.floor(Math.random() * chars.length)];
    const enc = new TextEncoder().encode(verifier);
    const hash = await crypto.subtle.digest('SHA-256', enc);
    const challenge = btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    return { verifier, challenge };
  }

  async function loginSpotify() {
    document.getElementById('status-msg').textContent = 'Redirigiendo a Spotify...';
    const { verifier, challenge } = await generatePKCE();
    localStorage.setItem('pkce_verifier', verifier);
    const url = new URL('https://accounts.spotify.com/authorize');
    url.searchParams.set('client_id', CLIENT_ID);
    url.searchParams.set('response_type', 'code');
    url.searchParams.set('redirect_uri', REDIRECT_URI);
    url.searchParams.set('scope', SCOPES);
    url.searchParams.set('code_challenge_method', 'S256');
    url.searchParams.set('code_challenge', challenge);
    // Redirige en el mismo WebViewer — funciona en App Inventor
    window.AppInventor.dispatchEvent('SpotifyLogin', 'url', url.toString());
  }

  async function exchangeCode(code) {
    document.getElementById('status-msg').textContent = 'Conectando...';
    const verifier = localStorage.getItem('pkce_verifier');
    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: verifier
    });
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      });
      const data = await res.json();
      if (data.access_token) {
        accessToken = data.access_token;
        localStorage.setItem('spotify_access_token', accessToken);
        localStorage.setItem('spotify_expires', Date.now() + (data.expires_in * 1000));
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        localStorage.removeItem('pkce_verifier');
        showPlayer();
      } else {
        document.getElementById('status-msg').textContent = 'Error al conectar. Intenta de nuevo.';
      }
    } catch(e) {
      document.getElementById('status-msg').textContent = 'Error de red.';
    }
  }

  async function refreshAccessToken() {
    const rt = localStorage.getItem('spotify_refresh_token');
    if (!rt) return false;
    const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: rt, client_id: CLIENT_ID });
    try {
      const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
      const data = await res.json();
      if (data.access_token) {
        accessToken = data.access_token;
        localStorage.setItem('spotify_access_token', accessToken);
        localStorage.setItem('spotify_expires', Date.now() + (data.expires_in * 1000));
        return true;
      }
    } catch(e) {}
    return false;
  }

  window.addEventListener('load', async () => {
    // Revisar si venimos del callback con un code
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    if (code) {
      // Limpiar la URL
      history.replaceState({}, '', window.location.pathname);
      await exchangeCode(code);
      return;
    }

    // Revisar token guardado
    const saved = localStorage.getItem('spotify_access_token');
    const expires = localStorage.getItem('spotify_expires');
    if (saved && expires && Date.now() < parseInt(expires)) {
      accessToken = saved;
      showPlayer();
    } else if (localStorage.getItem('spotify_refresh_token')) {
      const ok = await refreshAccessToken();
      if (ok) showPlayer();
    }
  });

  function showPlayer() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('player-screen').style.display = 'flex';
    getCurrentTrack();
    setInterval(getCurrentTrack, 5000);
  }

  function logout() {
    localStorage.removeItem('spotify_access_token');
    localStorage.removeItem('spotify_refresh_token');
    localStorage.removeItem('spotify_expires');
    accessToken = null;
    document.getElementById('player-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  async function apiCall(endpoint, method = 'GET', body = null) {
    if (!accessToken) return null;
    try {
      const opts = { method, headers: { 'Authorization': `Bearer ${accessToken}` } };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(`https://api.spotify.com/v1${endpoint}`, opts);
      if (res.status === 401) { await refreshAccessToken(); return null; }
      if (res.status === 204 || res.status === 202) return {};
      if (res.ok) return await res.json();
    } catch(e) {}
    return null;
  }

  async function getCurrentTrack() {
    const data = await apiCall('/me/player');
    if (!data || !data.item) return;
    isPlaying = data.is_playing;
    document.getElementById('play-btn').innerHTML = isPlaying ? '⏸' : '⏵';
    document.getElementById('song-status').textContent = isPlaying ? '▶ Reproduciendo' : '⏸ Pausado';
    document.getElementById('song-title').textContent = data.item.name;
    document.getElementById('song-artist').textContent = data.item.artists.map(a => a.name).join(', ');
    if (data.item.album?.images?.[0]) {
      const img = document.getElementById('album-art');
      img.src = data.item.album.images[0].url;
      img.style.display = 'block';
    }
    currentDuration = data.item.duration_ms;
    currentProgress = data.progress_ms || 0;
    updateProgress();
    if (data.device) { currentVolume = data.device.volume_percent; document.getElementById('vol-fill').style.width = currentVolume + '%'; }
  }

  function updateProgress() {
    if (progressInterval) clearInterval(progressInterval);
    const upd = () => {
      if (!currentDuration) return;
      document.getElementById('progress-fill').style.width = (currentProgress / currentDuration * 100) + '%';
      document.getElementById('time-current').textContent = msToTime(currentProgress);
      document.getElementById('time-total').textContent = msToTime(currentDuration);
    };
    upd();
    if (isPlaying) progressInterval = setInterval(() => { currentProgress = Math.min(currentProgress + 1000, currentDuration); upd(); }, 1000);
  }

  function msToTime(ms) { const s = Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  async function togglePlay() { await apiCall(isPlaying ? '/me/player/pause' : '/me/player/play', 'PUT'); setTimeout(getCurrentTrack, 400); }
  async function nextTrack() { await apiCall('/me/player/next', 'POST'); setTimeout(getCurrentTrack, 600); }
  async function prevTrack() { await apiCall('/me/player/previous', 'POST'); setTimeout(getCurrentTrack, 600); }
  async function changeVol(delta) {
    currentVolume = Math.max(0, Math.min(100, currentVolume + delta));
    document.getElementById('vol-fill').style.width = currentVolume + '%';
    await apiCall(`/me/player/volume?volume_percent=${currentVolume}`, 'PUT');
  }
  function handleVolClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
    changeVol(pct - currentVolume);
  }
</script>
</body>
</html>
